name: Notify browser website

on:
  release:
    types: [published, edited]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-browser-website
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.release.draft && !github.event.release.prerelease)

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Refresh website releases
        env:
          WEBSITE_RELEASE_TOKEN: ${{ secrets.WEBSITE_RELEASE_TOKEN }}

        run: |
          set -euo pipefail

          if [ -z "$WEBSITE_RELEASE_TOKEN" ]; then
            echo "Add WEBSITE_RELEASE_TOKEN to this repository's Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $WEBSITE_RELEASE_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"event_type":"cocoa-release-updated"}' \
            https://api.github.com/repos/Darkelf-Labs/darkelf-web-browser/dispatches