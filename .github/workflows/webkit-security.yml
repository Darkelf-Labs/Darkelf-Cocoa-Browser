name: Darkelf WebKit Security Audit

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  darkelf-webkit-audit:
    name: Darkelf WebKit Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Darkelf SecureAudit
        run: |
          python -m pip install --upgrade pip
          python -m pip install darkelf-secureaudit

      - name: Run Darkelf SecureAudit
        run: |
          darkelf-secureaudit darkelf_cocoa --sarif results.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
