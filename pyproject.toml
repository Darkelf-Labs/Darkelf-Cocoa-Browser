 [build-system]
 requires = ["setuptools>=61.0"]
 build-backend = "setuptools.build_meta"

 [project]
 name = "darkelf-cocoa"
 version = "4.4.3"
 description = "Darkelf Cocoa privacy browser for macOS"
 readme = "README.md"
 requires-python = ">=3.11"

 authors = [
   { name = "Dr. Kevin Moore" }
 ]

 license = { text = "LGPL-3.0-or-later" }

 dependencies = [
   "pyobjc",
   "tldextract"
 ]

 [project.scripts]
 # main browser command
 darkelf = "darkelf_cocoa.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["darkelf_cocoa*"]

[tool.setuptools.package-data]
darkelf_cocoa = [
    "assets/*",
    "assets/**/*"
]
