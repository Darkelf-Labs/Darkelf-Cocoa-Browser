[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkelf-cocoa"
version = "7.0.20"
description = "Darkelf Cocoa privacy browser for macOS"
readme = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "Dr. Kevin Moore" }
]

license = "LGPL-3.0-or-later"

dependencies = [
  "pyobjc",
  "tldextract"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: MacOS",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]

keywords = ["browser", "privacy", "macos", "cocoa"]

[project.scripts]
darkelf = "darkelf_cocoa.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["darkelf_cocoa*"]

[tool.setuptools.package-data]
darkelf_cocoa = [
  "assets/*",
  "assets/**/*"
]
EOF
